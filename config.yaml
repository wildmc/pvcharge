inverter:
  mode: neoom_beaam   # "neoom_beaam" or "solax_modbus"

  neoom_beaam:
    host: ""
    endpoint: /api/v1/site/state
    token: ""
    timeout: 10       # s
    keys:
      pv_power: POWER_PRODUCTION
      house_power: POWER_CONSUMPTION_CALC

  solax_modbus:
    host: ""
    port: 502
    unit_id: 1

    # Best guess SolaX X3 (Modbus TCP)
    registers:
      pv_power: 10        # register address for PV power, value unit depends on model (usually W)
      house_power: 70     # register address for grid/load power, value unit depends on model (usually W)

wallbox:
  mode: cloud   # "cloud" or "local"

  local:
    host: ""

  cloud:
    user_name: ""
    api_key: ""
    charger_id: ""

control:
  poll_interval: 20             # s
  wallbox_update_interval: 240  # s

  averaging_window: 12          # samples, 12 * 20 s = 240 s

  voltage: 230.0                # V

  min_current: 6                # A
  max_current: 16               # A

  # Hysteresis against rapid start/stop switching
  surplus_start_threshold: 1500 # W
  surplus_stop_threshold: 1200  # W

  # Safety behavior
  stop_below_min_current: true

mqtt:
  enabled: false
  host: 192.168.1.10
  port: 1883
  topic_prefix: pvcharge
